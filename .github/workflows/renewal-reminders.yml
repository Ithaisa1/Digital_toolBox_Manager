name: Renewal reminders

# Lanza cada día el envío de avisos de renovación.
# Necesita dos secretos en GitHub (Settings → Secrets and variables → Actions):
#   API_URL      → URL del backend, p. ej. https://digital-toolbox-api.onrender.com
#   CRON_SECRET  → el mismo valor que la variable CRON_SECRET del backend

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC (08:00/09:00 en España)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminders endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Faltan los secretos API_URL o CRON_SECRET. No se envían avisos."
            exit 0
          fi
          # Render (plan gratuito) puede tardar en despertar: reintentos con espera
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST "${API_URL%/}/api/jobs/renewal-reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
